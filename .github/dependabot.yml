version: 2

updates:
  # Native uv support (understands pyproject.toml + uv.lock directly) - this
  # is the exact class of gap that let a wrong Gemini/Groq SDK behavior sit
  # unnoticed: nothing was ever proposing version bumps here to begin with.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"

  # Keeps the actions used in .github/workflows/ (actions/checkout, ...) current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
