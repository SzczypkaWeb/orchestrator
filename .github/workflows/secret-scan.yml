name: Secret scan

# Scans the ENTIRE git history (not just the diff) for committed secrets on
# every PR and on every push to main. This repo is public and runs agents with
# shell access, so a leaked key here is expensive - and once a secret is in
# history, deleting the file doesn't remove it.
#
# Uses the gitleaks CLI directly (MIT-licensed) rather than gitleaks/gitleaks-action:
# that wrapper requires a paid/registered license key for repos owned by a GitHub
# organization (this one is), whereas the CLI itself is free.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# No write access, no OIDC, no secrets needed - which also means this runs
# normally on Dependabot PRs (see backend's deploy-gcp.yml history for why
# workflow-wide `id-token: write` is a trap there).
permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      # Pinned on purpose: a floating "latest" would let an upstream release
      # change what counts as a finding without any change in this repo.
      # Bump deliberately (Dependabot can't see this one).
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, not the default shallow clone - otherwise only the
          # tip commit would be scanned and old leaks would pass silently.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "${base}/${archive}" -o "${archive}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          ./gitleaks version

      # --redact: findings are printed with the secret value masked, so a
      # failing run can't itself re-leak the secret into public CI logs.
      - name: Scan git history
        run: ./gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1 .
